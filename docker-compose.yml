services:
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_HOST: postgres
      REDIS_HOST: redis
      VECTORSTORE_HOST: chroma
      VECTORSTORE_PORT: 8000
      STORAGE_ENDPOINT_URL: http://minio:9000
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - chroma
      - minio
    volumes:
      - ./src:/app/src

  worker:
    build: .
    command: ["arq", "chatfolio.workers.worker.WorkerSettings"]
    env_file: .env
    environment:
      DATABASE_HOST: postgres
      REDIS_HOST: redis
      VECTORSTORE_HOST: chroma
      VECTORSTORE_PORT: 8000
      STORAGE_ENDPOINT_URL: http://minio:9000
    depends_on:
      - postgres
      - redis
      - chroma
      - minio
    volumes:
      - ./src:/app/src

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chatfolio
      POSTGRES_PASSWORD: chatfolio
      POSTGRES_DB: chatfolio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  chroma:
    # Pinned to match the chromadb client version in pyproject.toml (see the comment there) —
    # `:latest` here was 1.4.4 while the client's `>=0.5` floated to 1.5.9 and broke the wire
    # protocol between them. Bump both together, deliberately, not independently.
    image: chromadb/chroma:1.4.4
    ports:
      - "8004:8000"
    volumes:
      - chroma_data:/chroma/chroma

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  chroma_data:
  minio_data:
