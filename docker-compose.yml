services:
  # One-shot: applies every Alembic migration, then exits. Neither `api` nor `worker` runs
  # migrations itself — two containers each racing to `alembic upgrade head` on startup is a
  # documented way to corrupt a migration (both see "nothing applied yet" and both try to run
  # the same DDL). This is the single place migrations happen; `api`/`worker` just wait for it
  # to finish successfully before they start, so a fresh/empty database (a new environment, a
  # freshly provisioned managed Postgres, etc.) always has its schema created before anything
  # queries it — the exact gap that caused `relation "users" does not exist` in production.
  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_HOST: postgres
      REDIS_HOST: redis
      VECTORSTORE_HOST: chroma
      VECTORSTORE_PORT: 8000
      STORAGE_ENDPOINT_URL: http://minio:9000
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      chroma:
        condition: service_started
      minio:
        condition: service_started
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
      - onnx_model_cache:/root/.cache/chroma

  worker:
    build: .
    command: ["arq", "chatfolio.workers.worker.WorkerSettings"]
    env_file: .env
    environment:
      DATABASE_HOST: postgres
      REDIS_HOST: redis
      VECTORSTORE_HOST: chroma
      VECTORSTORE_PORT: 8000
      STORAGE_ENDPOINT_URL: http://minio:9000
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      chroma:
        condition: service_started
      minio:
        condition: service_started
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
      - onnx_model_cache:/root/.cache/chroma

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chatfolio
      POSTGRES_PASSWORD: chatfolio
      POSTGRES_DB: chatfolio
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatfolio"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  chroma:
    # Pinned by digest, not tag: chromadb/chroma publishes no per-version stable tags (only a
    # moving `latest` and dev builds), so a tag can't guarantee reproducibility here — a digest
    # can. This digest resolves to server 1.4.4, matching the `chromadb==1.4.1` client pin in
    # pyproject.toml (see the comment there for why client/server drift broke the wire protocol
    # between them). Bump both together, deliberately, not independently — re-pull `:latest`,
    # confirm client compatibility, then update both pins to the new digest/version.
    image: chromadb/chroma@sha256:1e0b73a187a28757c572acba508c46f48c9e8b0acaf5c20e6d95cdedce1acdf6
    ports:
      - "8004:8000"
    volumes:
      # The server's own startup log states its persist path explicitly: `persist_path: "/data"`,
      # `Saving data to: /data` — NOT /chroma/chroma, which this was mounted at for this entire
      # project's history. That meant every write landed on the container's ephemeral layer, not
      # this named volume, and every embedding was silently lost on any `docker compose down` +
      # `up` cycle that recreated the chroma container (undetected until now because previous
      # troubleshooting only ever restarted api/worker, never chroma itself, so the same
      # long-lived container process kept its in-memory-since-boot data intact by accident).
      - chroma_data:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  chroma_data:
  minio_data:
  onnx_model_cache:
