name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chatfolio
          POSTGRES_PASSWORD: chatfolio
          POSTGRES_DB: chatfolio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chatfolio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_HOST: localhost
      DATABASE_USER: chatfolio
      DATABASE_PASSWORD: chatfolio
      DATABASE_NAME: chatfolio_test
      TEST_DATABASE_NAME: chatfolio_test
      STORAGE_ENDPOINT_URL: http://localhost:9000
      STORAGE_BUCKET: chatfolio-cv-test
      TEST_STORAGE_BUCKET: chatfolio-cv-test
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      REDIS_HOST: localhost
      TEST_REDIS_DB: 1

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src

      - name: Test
        run: uv run pytest

      - name: Build image
        run: docker build -t chatfolio-be:ci .
